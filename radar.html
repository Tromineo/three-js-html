  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /*
     * Raciocinio de construcao da aplicacao:

     */
    const RAIO_RADAR = 10, ESCALA_VERTICAL = 3, CAPACIDADE_PONTOS = 300, VOLTA_COMPLETA_RAD = Math.PI * 2, CHAVE_ARMAZENAMENTO = 'radar-ideias-v1'; /* Define dimensões da cena, capacidade dos buffers, volta angular e chave de persistência. */

    /* ---------- estado ---------- */
    let itensRadar = [], prazoSaidaMs = 604800000, idSelecionado = null, idSobCursor = null; /* Mantém os itens, o prazo e os ids selecionado e sob o cursor. */
    function salvarEstado() { /* Persiste no navegador o estado atual do radar. */

      } /* Encerra o tratamento de erro da gravação. */
    } /* Encerra a função de persistência. */
    function carregarEstado() { /* Recupera do navegador os itens e o prazo previamente gravados. */

          return true; /* Informa que o estado foi carregado. */
        } /* Encerra a validação do estado carregado. */
      } catch (e) { /* Trata JSON corrompido ou falha na leitura sem interromper a inicialização. */
      } /* Encerra o tratamento de erro do carregamento. */
      return false; /* Informa que não foi possível recuperar um estado utilizável. */
    } /* Encerra a função de carregamento. */
    const gerarIdItem = () => Math.random().toString(36).slice(2, 9); /* Gera um identificador curto aleatório para cada item. */
    const deslocamentoAngularPorId = idItem => { let hashAtual = 0; for (const caractereId of idItem) hashAtual = (hashAtual * 31 + caractereId.charCodeAt(0)) >>> 0; return (hashAtual % 1000) / 1000 - .5 }; /* Deriva do id um pequeno deslocamento estável para separar pontos visualmente. */
    function criarItem(textoItem, indiceCategoria, indicePrioridade, fracaoIdade) { 
      const idItem = gerarIdItem(); 
      return { 
        id: idItem, 
        text: textoItem, 
        cat: indiceCategoria, 
        pri: indicePrioridade, 
        t0: Date.now() - fracaoIdade * prazoSaidaMs 
      } 
    }
     /* Cria um item com id e instante inicial compatível com sua idade simulada. */
    if (!carregarEstado()) { 
      itensRadar = [
        criarItem('Escrever o artigo sobre sonares', 0, 1, .05), 
        criarItem('Enviar proposta ao cliente', 1, 0, .3), 
        criarItem('Marcar consulta médica', 2, 0, .55), 
        criarItem('Estudar WebGL shaders', 3, 2, .7), 
        criarItem('Ideia de app de receitas', 0, 2, .85), 
        criarItem('Renovar passaporte', 2, 1, .15)
      ]; 
      salvarEstado() 
    } 
    /* Se não há estado salvo, cria exemplos demonstrativos e grava-os. */
    elementoPorId('life').value = String(prazoSaidaMs); 
    /* Sincroniza o seletor de prazo com o valor carregado. */
    const fracaoPrazoDecorrido = itemRadar => (Date.now() - itemRadar.t0) / prazoSaidaMs; /* Calcula a fração do prazo já transcorrida para um item. */
    const formatarDuracao = duracaoMs => { 
      const minutos = Math.max(0, duracaoMs) / 60000; 
      if (minutos < 1) return Math.round(minutos * 60) + 's'; 
      if (minutos < 60) return Math.round(minutos) + ' min'; 
      if (minutos < 1440) return (minutos / 60).toFixed(1) + ' h'; 
      return (minutos / 1440).toFixed(1) + ' d' 
    }; 
    /* Formata milissegundos como segundos, minutos, horas ou dias. */

    /* ---------- cena ---------- */
    const canvasRadar = elementoPorId('c'), renderizadorWebGL = new THREE.WebGLRenderer({ canvas: canvasRadar, antialias: true }); /* Inicializa o renderizador WebGL ligado ao canvas da página. */
    renderizadorWebGL.setPixelRatio(Math.min(devicePixelRatio, 2)); /* Limita a densidade de pixels para equilibrar nitidez e desempenho. */
    const cenaRadar = new THREE.Scene(), cameraRadar = new THREE.PerspectiveCamera(45, 1, .1, 200); /* Cria a cena 3D e a câmera em perspectiva. */
    let anguloHorizontal = .5, anguloVertical = 1, distanciaCamera = 26; /* Guarda ângulos e distância usados para orbitar a câmera. */
    const posicionarCamera = () => { 
      cameraRadar.position.set(distanciaCamera * Math.sin(anguloVertical) * Math.sin(anguloHorizontal), distanciaCamera * Math.cos(anguloVertical), distanciaCamera * Math.sin(anguloVertical) * Math.cos(anguloHorizontal)); cameraRadar.lookAt(0, -1, 0) 
    }; 
    /* Posiciona a câmera em coordenadas esféricas e mira no centro do radar. */
    const redimensionarCena = () => { 
      renderizadorWebGL.setSize(innerWidth, innerHeight, false); cameraRadar.aspect = innerWidth / innerHeight; cameraRadar.updateProjectionMatrix() 
    }; /* Redimensiona a renderização e atualiza a proporção da câmera. */
    addEventListener('resize', redimensionarCena); redimensionarCena(); posicionarCamera(); /* Configura o redimensionamento e posiciona inicialmente a câmera. */
    const materialLinhas = new THREE.LineBasicMaterial({ color: 0x14485a }); /* Define o material das linhas da grade do radar. */
    const adicionarLinha = (pontoInicial, pontoFinal) => cenaRadar.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pontoInicial, pontoFinal]), materialLinhas)); /* Cria e adiciona à cena uma linha entre dois pontos. */
    for (let indiceAnel = 1; indiceAnel <= 5; indiceAnel++) { const pontosAnel = []; for (let indiceSegmento = 0; indiceSegmento <= 128; indiceSegmento++)pontosAnel.push(new THREE.Vector3(Math.sin(indiceSegmento / 128 * VOLTA_COMPLETA_RAD) * RAIO_RADAR * indiceAnel / 5, 0, -Math.cos(indiceSegmento / 128 * VOLTA_COMPLETA_RAD) * RAIO_RADAR * indiceAnel / 5)); cenaRadar.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pontosAnel), materialLinhas)) } /* Desenha cinco anéis concêntricos amostrando cada círculo em 128 segmentos. */

    for (let indiceRaio = 0; indiceRaio < 4; indiceRaio++) { const anguloRaio = indiceRaio / 4 * VOLTA_COMPLETA_RAD; adicionarLinha(new THREE.Vector3(), new THREE.Vector3(Math.sin(anguloRaio) * RAIO_RADAR, 0, -Math.cos(anguloRaio) * RAIO_RADAR)) } /* Desenha quatro raios que dividem o radar em setores de categoria. */

    const marcadorCentro = new THREE.Mesh(new THREE.SphereGeometry(.18, 16, 12), new THREE.MeshBasicMaterial({ color: 0xcfeee8 })); 
    cenaRadar.add(marcadorCentro); /* Marca o centro do radar com uma pequena esfera clara. */
    CATEGORIAS.forEach((categoria, indiceCategoria) => { /* Cria uma etiqueta visual para cada setor do radar. */
      const canvasEtiqueta = document.createElement('canvas'); canvasEtiqueta.width = 256; canvasEtiqueta.height = 64; const contextoEtiqueta = canvasEtiqueta.getContext('2d'); contextoEtiqueta.font = '600 34px Georgia,serif'; contextoEtiqueta.fillStyle = categoria.cor; contextoEtiqueta.textAlign = 'center'; contextoEtiqueta.fillText(categoria.nome, 128, 44); /* Desenha o nome da categoria em um canvas usado como textura. */
      
      const spriteCategoria = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvasEtiqueta), transparent: true, depthTest: false, fog: false })); /* Converte o texto em sprite sempre legível sobre a cena. */
      
      const anguloEtiqueta = (indiceCategoria * 90 + 45) * Math.PI / 180; spriteCategoria.position.set(Math.sin(anguloEtiqueta) * RAIO_RADAR * 1.12, 0, -Math.cos(anguloEtiqueta) * RAIO_RADAR * 1.12); spriteCategoria.scale.set(4, 1, 1); cenaRadar.add(spriteCategoria) /* Posiciona a etiqueta no meio do setor correspondente e a adiciona à cena. */
    }); /* Encerra a criação das etiquetas das categorias. */
    
    const materialVarredura = new THREE.ShaderMaterial({ /* Define o material GLSL da varredura luminosa do radar. */
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { uA: { value: 0 } }, /* Configura transparência, brilho aditivo e ângulo variável da varredura. */
      vertexShader: 'varying vec2 p;void main(){p=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}', /* Passa coordenadas locais do disco ao shader de fragmentos e projeta os vértices. */
      fragmentShader: 'uniform float uA;varying vec2 p;void main(){float b=atan(p.x,p.y);float d=mod(uA-b,6.2831853);float a=exp(-d*1.5)*.5;a+=step(d,.012)*.6;gl_FragColor=vec4(vec3(.24,.88,.77)*a,a);}' /* Calcula o brilho angular, a esteira e a linha mais intensa da varredura. */
    }); /* Encerra a configuração do shader de varredura. */
    
    const planoVarredura = new THREE.Mesh(new THREE.CircleGeometry(RAIO_RADAR, 96), materialVarredura); planoVarredura.rotation.x = -Math.PI / 2; cenaRadar.add(planoVarredura); /* Cria o disco da varredura no plano horizontal do radar. */

    const posicoesPontos = new Float32Array(CAPACIDADE_PONTOS * 3), coresPontos = new Float32Array(CAPACIDADE_PONTOS * 3), opacidadesPontos = new Float32Array(CAPACIDADE_PONTOS), tamanhosPontos = new Float32Array(CAPACIDADE_PONTOS), posicoesHastes = new Float32Array(CAPACIDADE_PONTOS * 6), coresHastes = new Float32Array(CAPACIDADE_PONTOS * 6); /* Reserva buffers de posições, cores, opacidade, tamanho e hastes para até CAPACIDADE_PONTOS pontos. */
    const geometriaPontos = new THREE.BufferGeometry(); /* Cria a geometria que agrupa os atributos dos pontos. */
    [['position', posicoesPontos, 3], ['color', coresPontos, 3], ['aAl', opacidadesPontos, 1], ['aSz', tamanhosPontos, 1]].forEach(([nomeAtributo, bufferAtributo, quantidadeComponentes]) => geometriaPontos.setAttribute(nomeAtributo, new THREE.BufferAttribute(bufferAtributo, quantidadeComponentes))); /* Registra na geometria os buffers e o número de componentes de cada atributo. */
    const nuvemPontos = new THREE.Points(geometriaPontos, new THREE.ShaderMaterial({ /* Cria o conjunto de pontos com um material customizado. */
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { k: { value: renderizadorWebGL.getPixelRatio() } }, /* Configura os pontos brilhantes e fornece a escala de pixels ao shader. */
      vertexShader: 'attribute vec3 color;attribute float aAl;attribute float aSz;varying vec3 c;varying float a;uniform float k;void main(){c=color;a=aAl;vec4 m=modelViewMatrix*vec4(position,1.);gl_PointSize=aSz*k*(180./-m.z);gl_Position=projectionMatrix*m;}', /* Define cor, opacidade e tamanho de cada ponto no shader de vértices. */
      fragmentShader: 'varying vec3 c;varying float a;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;float g=smoothstep(1.,.55,d);vec3 w=mix(c,vec3(1.),smoothstep(.5,.0,d)*.75);gl_FragColor=vec4(w*a*g,a*g);}' /* Recorta o ponto em círculo e suaviza seu brilho para formar um halo. */
    })); /* Encerra a criação do conjunto de pontos. */
    nuvemPontos.frustumCulled = false; cenaRadar.add(nuvemPontos); /* Desativa o descarte automático e insere os pontos na cena. */
    const geometriaHastes = new THREE.BufferGeometry(); geometriaHastes.setAttribute('position', new THREE.BufferAttribute(posicoesHastes, 3)); geometriaHastes.setAttribute('color', new THREE.BufferAttribute(coresHastes, 3)); /* Prepara os buffers de geometria e cor das hastes verticais. */
    const hastesPontos = new THREE.LineSegments(geometriaHastes, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); hastesPontos.frustumCulled = false; cenaRadar.add(hastesPontos); /* Cria e adiciona as hastes luminosas que ligam os pontos ao plano. */

    /* ---------- UI ---------- */
    const obterItensAtivos = () => itensRadar.filter(itemRadar => fracaoPrazoDecorrido(itemRadar) < 1); /* Seleciona apenas os itens que ainda não ultrapassaram o prazo. */
    function renderizarListas() { /* Atualiza as listas HTML de itens ativos e itens que saíram do radar. */
      const itensAtivos = obterItensAtivos().sort((itemA, itemB) => fracaoPrazoDecorrido(itemB) - fracaoPrazoDecorrido(itemA)), itensExpirados = itensRadar.filter(itemRadar => fracaoPrazoDecorrido(itemRadar) >= 1); /* Separa os estados e ordena os ativos do mais antigo ao mais recente. */
      const criarLinhaItem = (itemRadar, textoPrazo) => { /* Monta uma linha acessível da lista para um item e seu rótulo de tempo. */
        const elementoLinha = document.createElement('div'); elementoLinha.className = 'it' + (idSelecionado === itemRadar.id ? ' sel' : ''); elementoLinha.tabIndex = 0; /* Cria a linha e marca visualmente o item selecionado. */
        elementoLinha.innerHTML = '<i></i><span></span><small></small>'; elementoLinha.firstChild.style.background = CATEGORIAS[itemRadar.cat].cor; elementoLinha.children[1].textContent = itemRadar.text; elementoLinha.children[2].textContent = textoPrazo; /* Preenche a cor, o texto do item e o prazo sem inserir texto como HTML. */
        elementoLinha.onclick = () => { idSelecionado = itemRadar.id; renderizarListas(); mostrarInformacoes() }; elementoLinha.onkeydown = eventoTeclado => { if (eventoTeclado.key === 'Enter') elementoLinha.click() }; return elementoLinha /* Permite selecionar com clique ou Enter e devolve o elemento criado. */
      }; /* Encerra a função que monta uma linha da lista. */
      const listaAtivos = elementoPorId('list'), listaExpirados = elementoPorId('gone'); listaAtivos.replaceChildren(); listaExpirados.replaceChildren(); /* Obtém e limpa as listas para reconstruí-las com o estado atual. */
      if (!itensAtivos.length) listaAtivos.innerHTML = '<div class="empty">Radar limpo. Adicione um item acima.</div>'; /* Mostra uma mensagem quando não há itens ativos. */
      itensAtivos.forEach(itemRadar => listaAtivos.append(criarLinhaItem(itemRadar, formatarDuracao((1 - fracaoPrazoDecorrido(itemRadar)) * prazoSaidaMs)))); /* Renderiza itens ativos com o tempo restante formatado. */
      if (!itensExpirados.length) listaExpirados.innerHTML = '<div class="empty">Nada saiu ainda.</div>'; /* Mostra uma mensagem quando nenhum item expirou. */
      itensExpirados.forEach(itemRadar => listaExpirados.append(criarLinhaItem(itemRadar, 'fora'))); /* Renderiza na lista de expirados cada item fora do radar. */
